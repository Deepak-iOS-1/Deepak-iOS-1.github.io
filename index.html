<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Hotel Scratch Voucher Portal</title>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body {
  font-family: "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #1e3c72, #2a5298);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  color: #fff;
}

.card {
  background: #fff;
  color: #333;
  border-radius: 16px;
  padding: 24px;
  width: 420px;
}

input, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
}

button {
  background: #2a5298;
  color: #fff;
  border: none;
  cursor: pointer;
  border-radius: 6px;
}

button:disabled {
  background: #aaa;
}

.hidden { display: none; }

.voucher {
  border: 1px solid #ddd;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="card" id="loginCard">
  <h2>Manager Login</h2>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button id="loginBtn">Login</button>
</div>

<!-- DASHBOARD -->
<div class="card hidden" id="dashboard">
  <h2>Create Voucher</h2>
  <input id="title" placeholder="Voucher Title">
  <input id="discount" placeholder="Discount">
  <button id="createBtn">Create Voucher</button>

  <hr style="margin:20px 0;">
  <h3>All Vouchers</h3>
  <div id="voucherList">Loading...</div>

  <button id="qrBtn" style="margin-top:15px;">Generate Customer QR</button>
</div>

<!-- CUSTOMER -->
<div class="card hidden" id="customer"></div>

<script>
/* 🔥 FIREBASE INIT */
firebase.initializeApp({
  apiKey: "AIzaSyAAkMO0zICxPTPQ_fTADGhzA6DsGw1TCaU",
  authDomain: "humvoucher.firebaseapp.com",
  projectId: "humvoucher",
  storageBucket: "humvoucher.firebasestorage.app",
  messagingSenderId: "680552131862",
  appId: "1:680552131862:web:d786e7fd4c581cff8b3437"
});

const auth = firebase.auth();
const db = firebase.firestore();

let HOTEL_ID = null;
let unsubscribeVouchers = null;

/* 📧 EMAIL VALIDATION */
function isValidEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

/* 🔐 LOGIN */
document.getElementById("loginBtn").onclick = async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if (!email && !password) {
    alert("Please enter email and password");
    return;
  }

  if (!email) {
    alert("Please enter email");
    return;
  }

  if (!isValidEmail(email)) {
    alert("Invalid email format");
    return;
  }

  if (!password) {
    alert("Please enter password");
    return;
  }

  try {
    const userCred = await auth.signInWithEmailAndPassword(email, password);

    // 🔑 ASSIGN HOTEL BASED ON EMAIL
    if (email === "deepak@gmail.com") HOTEL_ID = "HOTEL_001";
    else if (email === "aman@gmail.com") HOTEL_ID = "HOTEL_002";
    else {
      alert("No hotel assigned to this email");
      await auth.signOut();
      return;
    }

    // 🏨 CREATE HOTEL IF NOT EXISTS
    const hotelRef = db.collection("hotels").doc(HOTEL_ID);
    const hotelSnap = await hotelRef.get();

    if (!hotelSnap.exists) {
      await hotelRef.set({
        email,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    document.getElementById("loginCard").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");

    loadVouchers();

  } catch (err) {
    if (err.code === "auth/user-not-found") {
      alert("Email not registered");
    } else if (err.code === "auth/wrong-password") {
      alert("Incorrect password");
    } else {
      alert(err.message);
    }
  }
};

/* ➕ CREATE VOUCHER */
document.getElementById("createBtn").onclick = async () => {
  const title = document.getElementById("title").value.trim();
  const discount = document.getElementById("discount").value.trim();

  if (!title || !discount) {
    alert("Please enter title and discount");
    return;
  }

  await db.collection("hotels")
    .doc(HOTEL_ID)
    .collection("vouchers")
    .add({
      title,
      discount,
      used: false,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

  document.getElementById("title").value = "";
  document.getElementById("discount").value = "";
};

/* 📄 LOAD VOUCHERS */
function loadVouchers() {
  const list = document.getElementById("voucherList");
  list.innerHTML = "Loading...";

  if (unsubscribeVouchers) unsubscribeVouchers();

  unsubscribeVouchers = db.collection("hotels")
    .doc(HOTEL_ID)
    .collection("vouchers")
    .orderBy("createdAt", "desc")
    .onSnapshot(snapshot => {
      list.innerHTML = "";

      if (snapshot.empty) {
        list.innerHTML = "No vouchers available";
        return;
      }

      snapshot.forEach(doc => {
        const v = doc.data();

        const div = document.createElement("div");
        div.className = "voucher";
        div.innerHTML = `
          <strong>${v.title}</strong><br>
          Discount: ${v.discount}<br>
          Status: ${v.used ? "❌ Used" : "✅ Active"}<br><br>
        `;

        const editBtn = document.createElement("button");
        editBtn.textContent = "✏️ Edit";
        editBtn.disabled = v.used;
        editBtn.onclick = () => editVoucher(doc.id, v);

        const delBtn = document.createElement("button");
        delBtn.textContent = "🗑 Delete";
        delBtn.style.background = "#c0392b";
        delBtn.onclick = () => deleteVoucher(doc.id);

        div.append(editBtn, delBtn);
        list.appendChild(div);
      });
    });
}

/* ✏️ EDIT */
function editVoucher(id, v) {
  const title = prompt("Edit title", v.title);
  const discount = prompt("Edit discount", v.discount);
  if (!title || !discount) return;

  db.collection("hotels").doc(HOTEL_ID)
    .collection("vouchers").doc(id)
    .update({ title, discount });
}

/* 🗑 DELETE */
function deleteVoucher(id) {
  if (!confirm("Delete voucher?")) return;
  db.collection("hotels").doc(HOTEL_ID)
    .collection("vouchers").doc(id).delete();
}

/* 🎯 CUSTOMER FLOW */
document.getElementById("qrBtn").onclick = () => {
  document.getElementById("dashboard").classList.add("hidden");
  const c = document.getElementById("customer");
  c.classList.remove("hidden");
  c.innerHTML = `<button onclick="scanVoucher()">🎯 Simulate Scan</button>`;
};

function scanVoucher() {
  const c = document.getElementById("customer");

  db.collection("hotels").doc(HOTEL_ID)
    .collection("vouchers")
    .where("used", "==", false)
    .get()
    .then(snapshot => {
      if (snapshot.empty) {
        c.innerHTML = "<h2>No vouchers left</h2>";
        return;
      }

      const d = snapshot.docs[Math.floor(Math.random() * snapshot.docs.length)];
      const v = d.data();
      d.ref.update({ used: true });

      c.innerHTML = `
        <h2>🎉 You Won</h2>
        <p>${v.title}</p>
        <strong>${v.discount}</strong>
      `;
    });
}
</script>
</body>
</html>
